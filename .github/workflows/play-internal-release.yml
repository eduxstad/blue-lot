name: Publish Blue Lot to Play Internal Testing

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name override (optional)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Automated internal testing release'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Set Play version code
        id: version
        run: |
          set -euo pipefail
          base=$(sed -n 's/.*android:versionCode="\([0-9][0-9]*\)".*/\1/p' android/AndroidManifest.xml)
          if [ -z "$base" ]; then
            echo "Could not read android:versionCode from android/AndroidManifest.xml" >&2
            exit 1
          fi
          code=$((base + GITHUB_RUN_NUMBER))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code (manifest $base + run $GITHUB_RUN_NUMBER)"

      # build.sh fetches pinned AndroidX/Guava jars and bundletool 1.18.3
      # into android/.deps when they are not already there.
      - name: Build signed APK and AAB
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash android/build.sh

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blue-Lot-aab
          path: artifacts/Blue-Lot.aab
          if-no-files-found: error

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVER_ACCOUNT_JSON }}
          packageName: com.bluelot.app
          releaseFiles: artifacts/Blue-Lot.aab
          track: internal
          status: draft
